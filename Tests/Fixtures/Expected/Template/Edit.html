<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
    <h1><foundation:translate id="header" /></h1>

    <f:form
        action="update"
        method="post"
        name="product"
        object="{product}">
        <f:render partial="FormFields/Product" />

        <div class="d-flex gap-2 mt-3">
            <f:link.action
                action="show"
                arguments="{product: product}"
                class="btn btn-secondary">
                <foundation:translate id="cancel" />
            </f:link.action>
            <f:form.submit
                class="btn btn-primary"
                value="{foundation:translate(id: 'save')}" />
        </div>
    </f:form>
</html>
